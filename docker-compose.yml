###############################################################################
# Agentic Platform — Full Local Developer Stack
# Usage:  docker compose up -d
###############################################################################

services:
  # ── UI Console (Platform Dashboard) ───────────────────────────────────────
  ui-console:
    build:
      context: ./services/ui-console
      dockerfile: Dockerfile
    container_name: ui-console
    ports:
      - "${UI_PORT:-3000}:3001"
    environment:
      - PORT=3001
      - AGENT_URL=http://agent-service:8000
      - N8N_URL=http://n8n:5678
      - LANGFUSE_URL=http://langfuse:3000
      - GRAFANA_URL=http://grafana:3000
      - N8N_EXTERNAL_URL=http://localhost:${N8N_PORT:-5678}
      - LANGFUSE_EXTERNAL_URL=http://localhost:${LANGFUSE_PORT:-3012}
      - GRAFANA_EXTERNAL_URL=http://localhost:${GRAFANA_PORT:-3013}
      - AGENT_EXTERNAL_URL=http://localhost:${AGENT_PORT:-8010}
      - CHROMA_URL=http://chromadb:8000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-lf-local-dev}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-lf-local-dev}
    depends_on:
      agent-service:
        condition: service_healthy
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Workflow Orchestrator — n8n ───────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:${N8N_PORT:-5678}/
      - GENERIC_TIMEZONE=UTC
      - NODE_ENV=production
      - N8N_USER_MANAGEMENT_DISABLED=true
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── LLM Runtime — Ollama ─────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "${OLLAMA_PORT:-11436}:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Agent Service — FastAPI + LangGraph ──────────────────────────────────
  agent-service:
    build:
      context: ./services/agent
      dockerfile: Dockerfile
    container_name: agent-service
    ports:
      - "${AGENT_PORT:-8010}:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-06-01}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-gpt-4o-mini}
      - TOOLS_SERVICE_URL=http://tools-service:8001
      - MEMORY_DIR=/data
      - CHROMA_URL=${CHROMA_URL:-http://chromadb:8000}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-lf-local-dev}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-lf-local-dev}
      - LANGFUSE_HOST=http://langfuse:3000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    volumes:
      - ./services/agent:/app
      - ./data:/data
    depends_on:
      ollama:
        condition: service_healthy
      tools-service:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - platform-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Tools Service — FastAPI ──────────────────────────────────────────────
  tools-service:
    build:
      context: ./services/tools
      dockerfile: Dockerfile
    container_name: tools-service
    ports:
      - "${TOOLS_PORT:-8011}:8001"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - AGENT_SERVICE_URL=http://agent-service:8000
      - CHROMA_URL=http://chromadb:8000
    volumes:
      - ./services/tools:/app
      - ./data:/data
    networks:
      - platform-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Langfuse (LLM Observability) ─────────────────────────────────────────
  langfuse-db:
    image: postgres:16-alpine
    container_name: langfuse-db
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=${LANGFUSE_DB_PASSWORD:-langfuse}
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse:
    image: langfuse/langfuse:2
    container_name: langfuse
    ports:
      - "${LANGFUSE_PORT:-3012}:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:${LANGFUSE_DB_PASSWORD:-langfuse}@langfuse-db:5432/langfuse
      - NEXTAUTH_URL=http://localhost:${LANGFUSE_PORT:-3012}
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:-supersecret-nextauth}
      - SALT=${LANGFUSE_SALT:-supersecret-salt}
      - TELEMETRY_ENABLED=true
      - LANGFUSE_INIT_ORG_ID=default
      - LANGFUSE_INIT_ORG_NAME=Local Dev
      - LANGFUSE_INIT_PROJECT_ID=default
      - LANGFUSE_INIT_PROJECT_NAME=Agentic Platform
      - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-lf-local-dev}
      - LANGFUSE_INIT_PROJECT_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-lf-local-dev}
      - LANGFUSE_INIT_USER_EMAIL=admin@local.dev
      - LANGFUSE_INIT_USER_PASSWORD=changeme
      - LANGFUSE_INIT_USER_NAME=Admin
      - LANGFUSE_CSP_ENFORCE_HTTPS=false
      - NEXT_PUBLIC_LANGFUSE_CLOUD_REGION=
    depends_on:
      langfuse-db:
        condition: service_healthy
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/public/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── OpenTelemetry Collector ──────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./services/otel/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "8889:8889"   # Prometheus exporter
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:13133/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Prometheus ───────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Grafana ──────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    ports:
      - "${GRAFANA_PORT:-3013}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_COOKIE_SAMESITE=disabled
      - GF_SECURITY_COOKIE_SECURE=false
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Loki (Log Aggregation) ───────────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── (Optional) Vector Memory — ChromaDB ──────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.6.3
    container_name: chromadb
    ports:
      - "${CHROMA_PORT:-8200}:8000"
    environment:
      - ANONYMIZED_TELEMETRY=false
    volumes:
      - chroma-data:/chroma/chroma
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8000' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  n8n-data:
  ollama-data:
  chroma-data:
  langfuse-db-data:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  platform-net:
    driver: bridge
