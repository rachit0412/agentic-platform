###############################################################################
# Agentic Platform CI — GitHub Actions
# Stages: lint → unit → build → integration → smoke → (manual) e2e / load
###############################################################################
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOCKER_BUILDKIT: 1

jobs:
  # ── Stage 1: Lint ────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python linters
        run: pip install ruff

      - name: Lint agent service
        run: ruff check services/agent/

      - name: Lint tools service
        run: ruff check services/tools/

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint console
        working-directory: services/ui-console
        run: |
          npm ci
          npx --yes eslint server.js marketplace.js --no-eslintrc --rule '{"no-unused-vars":"warn"}' || true

  # ── Stage 2: Unit Tests ─────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      # ── Python tests ──
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install agent deps
        run: pip install -r services/agent/requirements.txt pytest anyio httpx

      - name: Install tools deps
        run: pip install -r services/tools/requirements.txt pytest anyio httpx

      - name: Run agent unit tests
        working-directory: services/agent
        run: python -m pytest ../../tests/unit/test_agent.py ../../tests/unit/test_vectorstore.py ../../tests/unit/test_llm.py -v
        env:
          PYTHONPATH: .

      - name: Run tools unit tests
        working-directory: services/tools
        run: python -m pytest ../../tests/unit/test_tools.py -v
        env:
          PYTHONPATH: .

      # ── Node tests ──
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install console deps
        working-directory: services/ui-console
        run: npm ci

      - name: Run console unit tests
        working-directory: services/ui-console
        run: npx jest ../../tests/unit/test_console.test.js --forceExit
        env:
          NODE_ENV: test

  # ── Stage 3: Build Images ───────────────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        run: docker compose build

      - name: Verify images
        run: |
          docker images | grep -E "agent|tools|ui|console" || true

  # ── Stage 4: Integration + Smoke ────────────────────────────────────────
  integration:
    name: Integration & Smoke Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: |
          docker compose up -d --build
          echo "Waiting for services to become healthy..."
          sleep 30

      - name: Check service status
        run: docker compose ps

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: pip install pytest httpx

      - name: Run smoke test
        run: bash tests/smoke/smoke-test.sh
        continue-on-error: true

      - name: Run integration tests
        run: pytest tests/integration/ -v --timeout=120
        continue-on-error: true

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ── Stage 5: Contract Tests ─────────────────────────────────────────────
  contract:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: |
          docker compose up -d --build
          sleep 30

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pytest httpx

      - name: Run contract tests
        run: pytest tests/contract/ -v --timeout=120
        continue-on-error: true

      - name: Tear down
        if: always()
        run: docker compose down -v
