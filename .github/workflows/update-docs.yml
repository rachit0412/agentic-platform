name: Update Documentation

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'docker-compose.yml'
      - 'observability/**'
      - 'tests/**'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate docs
        run: bash scripts/generate-docs.sh

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ARCHITECTURE.md docs/GET_STARTED.md
          git diff --cached --quiet || git commit -m "docs: auto-update architecture & get-started [skip ci]"
          git push
